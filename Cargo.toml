[package]
name = "tpb"
version = "0.1.0"
edition = "2024"
description = "Search Torznab-compatible torrent indexers from the terminal"
license = "MIT"

[[bin]]
name = "tpb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
